services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mapploy
      POSTGRES_USER: ${DATABASE_USERNAME:-mapploy}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mapploy}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mapploy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mapploy-postgres:
